version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run: echo "This is a build step"

  test:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run: echo "This is a test step"

  integration:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          command: |
            echo "This is an integration step"
            exit 1 || true

  artifact:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          command: echo "hello" > hello.txt
      - store_artifacts:
          path: hello.txt

  prod:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run: echo "This is a deploy step"

workflows:
  django:
    jobs:
      - build

      - test:
          requires:
            - build

      - integration:
          requires:
            - test

      - artifact:
          requires:
            - integration

      - prod:
          requires:
            - artifact
          type: approval
