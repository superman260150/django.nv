version: 2.1
jobs:
  build:
    docker:
      - image: python:3.6                   # similar to "image" in GitLab
    steps:
      - checkout
      - run: |                              # similar to "script" in GitLab
          pip install -r requirements.txt
          python manage.py check

  test:
    docker:
      - image: python:3.6
    steps:
      - checkout
      - run: |
          pip install -r requirements.txt
          python manage.py test taskManager

  integration:
    docker:
      - image: python:3.6
    steps:
      - checkout
      - run:
          command: |
            echo "This is an integration step"
            exit 1
          when: on_fail                   # Even if the job fails, continue to the next stages

  release:
    machine: true
    steps:
      - checkout
      - run: |
            echo "USERNAME length: 0"
            echo "PASSWORD length: 0"
          # echo  | docker login -u  --password-stdin
          # docker build -t /django.nv .   # Build the application into Docker image
          # docker push /django.nv         # Push the image into registry
  prod:
    docker:
      - image: python:3.6
    steps:
      - checkout
      - run: echo "This is a 'deploy' step."

workflows:
  django:
    jobs:
      - build
      - test
      - integration
      - release
      - prod:
          type: approval
          requires:
            - integration
