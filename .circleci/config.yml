jobs:
  build:
    docker:
      - image: cimg/base:stable                   # similar to "image" in GitLab
    steps:
      - checkout
      - run: echo "This is a build step"          # similar to "script" in GitLab

  test:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run: echo "This is a test step"

  integration:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          command: |
            echo "This is an integration step"
            exit 1 || true 
           # make this job don't fail by appendingn || true
           
  artifact:
	  docker:
		  - image: cimg/base:stable
	   steps:
		   - checkout
		   - run:
				   command: echo "hello">hello.txt
       - store_artifacts:
	         path: hello.txt

  prod:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run: echo "This is a deploy step"

workflows:
  version: 2
  django:
    jobs:
      - build
      - test
		      requires: # sequential jobs
		          - build
      - integration
 		      requires:
		          - test
      - artifact
 		      requires:
		          - integration
      - prod:
 		      requires:
		          - artifact
          type: approval
